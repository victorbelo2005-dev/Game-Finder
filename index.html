<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Jogos</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="header">
        <h1 class="header__title">GameFinder</h1>
        <p class="header__subtitle">Encontre jogos free-to-play</p>

        <div class="search">
            <input
                type="text"
                id="search-input"
                class="search__input"
                placeholder="Digite um nome de um jogo..."
                autocomplete="off"
            >
            <button id="search-button" class="search__button" type="button">Buscar</button>
        </div>
    </header>

    <main class="main">
        <p id="message" class="message" hidden></p>
        <section id="results" class="results"></section>
    </main>

    <!--modal:fica escondido ate o modulo 8 -->
    <div id="modal" class="modal" hidden>
        <div class="modal__content">
            <button id="modal-close" class="modal__close" type="button" aria-label="Fechar">&times;</button>
            <div id="modal-body" class="modal__body"></div>
        </div>
    </div>

    <footer class="footer">
        <p>
            Dados fornecidos por
            <a href="https://www.freetogame.com" target="_blank" rel="noopener">FreeToGame.com</a>
        </p>
    </footer>

    
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
